name: Publish Pages

on:
  push:
    branches: ['xr/main']
    paths:
      # Pages deploys are branch-scoped by environment policy. Release tags are
      # still scanned when generating the manifest, but tag-triggered Pages
      # deployments are intentionally avoided.
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Generate latest installable release manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const labTagPattern = /^v\d+\.\d+\.\d+-xr\d+$/;
            const hasRuntimeAsset = (release, pattern) =>
              (release.assets || []).some((asset) => pattern.test(asset.name));
            const candidates = releases
              .filter((release) =>
                !release.draft &&
                labTagPattern.test(release.tag_name) &&
                hasRuntimeAsset(release, /^kernel-xr-[0-9].*\.rpm$/) &&
                hasRuntimeAsset(release, /^kernel-xr-rt-[0-9].*\.rpm$/)
              )
              .sort((a, b) =>
                new Date(b.published_at || b.created_at) -
                new Date(a.published_at || a.created_at)
              );
            if (candidates.length === 0) {
              throw new Error("No installable linux-xr lab release found.");
            }
            const data = candidates[0];
            const payload = {
              manifest_schema_version: 2,
              selection: "latest-installable-lab-release",
              tag_name: data.tag_name,
              prerelease: data.prerelease,
              published_at: data.published_at,
              html_url: data.html_url,
              assets: data.assets.map((asset) => ({
                name: asset.name,
                size: asset.size,
                browser_download_url: asset.browser_download_url,
              })),
            };
            fs.mkdirSync(path.join("site", "releases"), { recursive: true });
            fs.writeFileSync(
              path.join("site", "releases", "latest.json"),
              JSON.stringify(payload, null, 2) + "\n",
            );

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

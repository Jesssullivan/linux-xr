name: Build XR Kernel RPMs

on:
  push:
    tags:
      - 'v*-xr*'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., 6.19.5)'
        required: true
        default: '6.19.5'
      xr_release:
        description: 'XR release number'
        required: true
        default: '1'
      rt_version:
        description: 'RT patch version (empty to skip RT)'
        required: false
        default: '6.19.3-rt1'
      variant:
        description: 'Which variant(s) to build'
        required: true
        type: choice
        options:
          - both
          - rt
          - generic
        default: 'both'
      use_ccache:
        description: 'Restore/save ccache (can add large cache transfer time)'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  build-rpm:
    runs-on: tinyland-dind
    timeout-minutes: 360
    env:
      BUILD_IMAGE: rockylinux/rockylinux:10

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant:
          - { name: generic, rt_version: "" }
          - { name: rt, rt_version: "6.19.3-rt1" }

    steps:
      - name: Check variant filter
        id: filter
        run: |
          # Skip this matrix entry if workflow_dispatch selected a specific variant
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="${{ github.event.inputs.variant }}"
            CURRENT="${{ matrix.variant.name }}"
            if [[ "${SELECTED}" != "both" && "${SELECTED}" != "${CURRENT}" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping ${CURRENT} variant (selected: ${SELECTED})"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse version from tag
        if: steps.filter.outputs.skip != 'true'
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # v6.19.5-xr1 -> kversion=6.19.5, xr_release=1
            KVERSION=$(echo "$TAG" | sed 's/^v//; s/-xr.*//')
            XR_RELEASE=$(echo "$TAG" | sed 's/.*-xr//')
          else
            KVERSION="${{ inputs.kernel_version }}"
            XR_RELEASE="${{ inputs.xr_release }}"
          fi
          # Tag builds use the current pinned RT lane. Manual dispatch can test a
          # newly published RT patch before the repository default moves.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ matrix.variant.name }}" == "rt" ]]; then
            RT_VERSION="${{ inputs.rt_version }}"
          else
            RT_VERSION="${{ matrix.variant.rt_version }}"
          fi
          if [[ "${{ matrix.variant.name }}" == "rt" && -z "${RT_VERSION}" ]]; then
            echo "RT variant requires rt_version."
            exit 1
          fi
          echo "kversion=${KVERSION}" >> "$GITHUB_OUTPUT"
          echo "xr_release=${XR_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "rt_version=${RT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building kernel ${KVERSION}-${XR_RELEASE}.xr.el10 [${{ matrix.variant.name }}] (RT: ${RT_VERSION:-disabled})"

      - name: Clean stale workspace cache
        if: steps.filter.outputs.skip != 'true'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            "${BUILD_IMAGE}" \
            bash -lc 'rm -rf /work/.ccache'

      - name: Checkout
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            xr

      - name: Restore ccache
        if: steps.filter.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_ccache == 'true')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/linux-xr-ccache-${{ matrix.variant.name }}
          key: ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-${{ hashFiles('xr/config/base.config') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-${{ hashFiles('xr/config/base.config') }}-
            ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-
            ccache-${{ steps.version.outputs.kversion }}-

      - name: Restore kernel sources
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/linux-xr-rpmbuild-${{ matrix.variant.name }}/SOURCES/linux-*.tar.xz
            ${{ runner.temp }}/linux-xr-rpmbuild-${{ matrix.variant.name }}/SOURCES/patch-*-rt*.patch
          key: sources-${{ steps.version.outputs.kversion }}-${{ steps.version.outputs.rt_version }}

      - name: Clean previous RPM outputs
        if: steps.filter.outputs.skip != 'true'
        run: |
          RPMBUILD_HOST="${RUNNER_TEMP}/linux-xr-rpmbuild-${{ matrix.variant.name }}"
          mkdir -p "${RPMBUILD_HOST}/RPMS"
          find "${RPMBUILD_HOST}/RPMS" -type f -name 'kernel-xr*.rpm' -delete

      - name: Build RPMs
        if: steps.filter.outputs.skip != 'true'
        env:
          KVERSION: ${{ steps.version.outputs.kversion }}
          XR_RELEASE: ${{ steps.version.outputs.xr_release }}
          RT_VERSION: ${{ steps.version.outputs.rt_version }}
        run: |
          CCACHE_DIR_HOST="${RUNNER_TEMP}/linux-xr-ccache-${{ matrix.variant.name }}"
          RPMBUILD_HOST="${RUNNER_TEMP}/linux-xr-rpmbuild-${{ matrix.variant.name }}"
          mkdir -p "${RPMBUILD_HOST}" "${CCACHE_DIR_HOST}"
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${RPMBUILD_HOST}:/root/rpmbuild" \
            -v "${CCACHE_DIR_HOST}:/work/.ccache" \
            -w /work \
            -e HOME=/root \
            -e GITHUB_WORKSPACE=/work \
            -e KVERSION \
            -e XR_RELEASE \
            -e RT_VERSION \
            -e CC="ccache gcc" \
            "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              for repo in /etc/yum.repos.d/rocky*.repo; do
                sed -i "s|^mirrorlist=|#mirrorlist=|" "$repo"
                sed -i "s|^#baseurl=http://dl.rockylinux.org|baseurl=https://dl.rockylinux.org|" "$repo"
              done
              dnf install -y --setopt=retries=3 epel-release
              dnf config-manager --set-enabled crb
              dnf install -y --setopt=retries=3 \
                gcc make elfutils-libelf-devel openssl-devel openssl \
                bc bison flex rsync rpm-build dwarves kmod \
                curl xz patch tar gzip cpio ccache \
                lld zstd libzstd-devel perl-interpreter \
                diffutils findutils
              ccache --set-config=cache_dir=/work/.ccache
              ccache --max-size=8G
              ccache --set-config=compression=true
              ccache --set-config=compression_level=6
              ccache --set-config=depend_mode=true
              ccache --set-config=sloppiness=time_macros,pch_defines
              ccache -z
              chmod +x xr/scripts/build-rpm.sh
              RT_FLAG=()
              if [[ -n "${RT_VERSION}" ]]; then
                RT_FLAG=(--rt-version "${RT_VERSION}")
              fi
              xr/scripts/build-rpm.sh \
                --kernel-version "${KVERSION}" \
                --xr-release "${XR_RELEASE}" \
                "${RT_FLAG[@]}"
              ccache -s
            '

      # Explicit cache saves — not reliant on post hooks that get killed on cancellation
      - name: Save ccache
        if: always() && steps.filter.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_ccache == 'true')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/linux-xr-ccache-${{ matrix.variant.name }}
          key: ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-${{ hashFiles('xr/config/base.config') }}-${{ github.sha }}

      - name: Save kernel sources
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/linux-xr-rpmbuild-${{ matrix.variant.name }}/SOURCES/linux-*.tar.xz
            ${{ runner.temp }}/linux-xr-rpmbuild-${{ matrix.variant.name }}/SOURCES/patch-*-rt*.patch
          key: sources-${{ steps.version.outputs.kversion }}-${{ steps.version.outputs.rt_version }}

      - name: Upload RPM artifacts
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xr-rpms-${{ matrix.variant.name }}
          path: ${{ runner.temp }}/linux-xr-rpmbuild-${{ matrix.variant.name }}/RPMS/**/*.rpm
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-xr-rpms-*
          merge-multiple: true
          path: rpms/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
          generate_release_notes: true
          body: |
            ## XR Kernel Release

            Built from tag `${{ github.ref_name }}` with carry patches from
            [`xr/patches`](https://github.com/tinyland-inc/linux-xr/tree/xr/main/xr/patches)
            and gated security backports from
            [`xr/security`](https://github.com/tinyland-inc/linux-xr/tree/xr/main/xr/security).

            ### Variants
            - **kernel-xr** (generic) — standard preemption
            - **kernel-xr-rt** — PREEMPT_RT real-time scheduling

            ### Patches applied
            - `0007-vesa-dsc-bpp.patch` — VESA DisplayID DSC BPP parser + QP/RC fixes
            - `bigscreen-beyond-edid.patch` — EDID non-desktop quirk (BIG/0x1234 + 0x5095)
            - `cve-2026-31431-algif-aead.patch` — applied automatically for vulnerable 6.19.x bases
            - PREEMPT_RT (RT variant only)

            ### Install
            ```bash
            # Choose one:
            curl -fsSL https://tinyland-inc.github.io/linux-xr/install/rocky10-generic.sh | bash
            curl -fsSL https://tinyland-inc.github.io/linux-xr/install/rocky10-rt.sh | bash
            ```

            ### Verify
            ```bash
            uname -r  # should show *-xr.el10
            ```

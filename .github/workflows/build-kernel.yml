name: Build XR Kernel RPMs

on:
  push:
    tags:
      - 'v*-xr*'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., 6.19.5)'
        required: true
        default: '6.19.5'
      xr_release:
        description: 'XR release number'
        required: true
        default: '1'
      rt_version:
        description: 'RT patch version (empty to skip RT)'
        required: false
        default: '6.19.3-rt1'

jobs:
  build-rpm:
    runs-on: linux-xr-docker
    container:
      image: rockylinux/rockylinux:10
    timeout-minutes: 180

    steps:
      - name: Parse version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # v6.19.5-xr1 -> kversion=6.19.5, xr_release=1
            KVERSION=$(echo "$TAG" | sed 's/^v//; s/-xr.*//')
            XR_RELEASE=$(echo "$TAG" | sed 's/.*-xr//')
            RT_VERSION="6.19.3-rt1"
          else
            KVERSION="${{ inputs.kernel_version }}"
            XR_RELEASE="${{ inputs.xr_release }}"
            RT_VERSION="${{ inputs.rt_version }}"
          fi
          echo "kversion=${KVERSION}" >> "$GITHUB_OUTPUT"
          echo "xr_release=${XR_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "rt_version=${RT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building kernel ${KVERSION}-${XR_RELEASE}.xr.el10 (RT: ${RT_VERSION:-disabled})"

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc make elfutils-libelf-devel openssl-devel openssl \
            perl-interpreter bc bison flex rsync rpm-build \
            dwarves kmod curl xz patch tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPMs
        run: |
          chmod +x xr/scripts/build-rpm.sh
          RT_FLAG=""
          if [[ -n "${{ steps.version.outputs.rt_version }}" ]]; then
            RT_FLAG="--rt-version ${{ steps.version.outputs.rt_version }}"
          fi
          xr/scripts/build-rpm.sh \
            --kernel-version "${{ steps.version.outputs.kversion }}" \
            --xr-release "${{ steps.version.outputs.xr_release }}" \
            ${RT_FLAG}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xr-rpms
          path: ~/rpmbuild/RPMS/**/*.rpm
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-xr-rpms
          path: rpms/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
          generate_release_notes: true
          body: |
            ## XR Kernel Release

            Built from tag `${{ github.ref_name }}` with patches from
            [XoxdWM](https://github.com/Jesssullivan/XoxdWM/tree/main/patches).

            ### Patches applied
            - `0007-vesa-dsc-bpp.patch` — VESA DisplayID DSC BPP parser + QP/RC fixes
            - `bigscreen-beyond-edid.patch` — EDID non-desktop quirk (BIG/0x1234 + 0x5095)
            - PREEMPT_RT (if RT build)

            ### Install
            ```bash
            sudo dnf install ./kernel-xr-*.x86_64.rpm
            sudo reboot
            ```

            ### Verify
            ```bash
            uname -r  # should show *-xr.el10
            ```

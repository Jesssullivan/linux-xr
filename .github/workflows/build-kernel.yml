name: Build XR Kernel RPMs

on:
  push:
    tags:
      - 'v*-xr*'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., 6.19.5)'
        required: true
        default: '6.19.5'
      xr_release:
        description: 'XR release number'
        required: true
        default: '1'
      rt_version:
        description: 'RT patch version (empty to skip RT)'
        required: false
        default: '6.19.3-rt1'
      variant:
        description: 'Which variant(s) to build'
        required: true
        type: choice
        options:
          - both
          - rt
          - generic
        default: 'both'

jobs:
  build-rpm:
    runs-on: linux-xr-docker
    timeout-minutes: 360

    strategy:
      max-parallel: 1
      matrix:
        variant:
          - { name: generic, rt_version: "" }
          - { name: rt, rt_version: "6.19.3-rt1" }

    if: >-
      always()

    steps:
      - name: Check variant filter
        id: filter
        run: |
          # Skip this matrix entry if workflow_dispatch selected a specific variant
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="${{ github.event.inputs.variant }}"
            CURRENT="${{ matrix.variant.name }}"
            if [[ "${SELECTED}" != "both" && "${SELECTED}" != "${CURRENT}" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping ${CURRENT} variant (selected: ${SELECTED})"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse version from tag
        if: steps.filter.outputs.skip != 'true'
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # v6.19.5-xr1 -> kversion=6.19.5, xr_release=1
            KVERSION=$(echo "$TAG" | sed 's/^v//; s/-xr.*//')
            XR_RELEASE=$(echo "$TAG" | sed 's/.*-xr//')
          else
            KVERSION="${{ inputs.kernel_version }}"
            XR_RELEASE="${{ inputs.xr_release }}"
          fi
          # RT version comes from the matrix
          RT_VERSION="${{ matrix.variant.rt_version }}"
          echo "kversion=${KVERSION}" >> "$GITHUB_OUTPUT"
          echo "xr_release=${XR_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "rt_version=${RT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building kernel ${KVERSION}-${XR_RELEASE}.xr.el10 [${{ matrix.variant.name }}] (RT: ${RT_VERSION:-disabled})"

      - name: Install build dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make libelf-dev libssl-dev openssl \
            bc bison flex rsync rpm dwarves kmod \
            curl xz-utils patch tar gzip cpio ccache \
            lld zstd libzstd-dev

      - name: Checkout
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Restore ccache
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-${{ hashFiles('xr/config/base.config') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-${{ hashFiles('xr/config/base.config') }}-
            ccache-${{ matrix.variant.name }}-${{ steps.version.outputs.kversion }}-
            ccache-${{ steps.version.outputs.kversion }}-
          save-always: true

      - name: Restore kernel sources
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/rpmbuild/SOURCES/linux-*.tar.xz
            ~/rpmbuild/SOURCES/patch-*-rt*.patch
          key: sources-${{ steps.version.outputs.kversion }}-${{ steps.version.outputs.rt_version }}

      - name: Configure ccache
        if: steps.filter.outputs.skip != 'true'
        run: |
          ccache --set-config=cache_dir=${{ github.workspace }}/.ccache
          ccache --max-size=8G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=depend_mode=true
          ccache --set-config=sloppiness=time_macros,pch_defines
          ccache -z
          echo "CC=ccache gcc" >> "$GITHUB_ENV"

      - name: Build RPMs
        if: steps.filter.outputs.skip != 'true'
        run: |
          chmod +x xr/scripts/build-rpm.sh
          RT_FLAG=""
          if [[ -n "${{ steps.version.outputs.rt_version }}" ]]; then
            RT_FLAG="--rt-version ${{ steps.version.outputs.rt_version }}"
          fi
          xr/scripts/build-rpm.sh \
            --kernel-version "${{ steps.version.outputs.kversion }}" \
            --xr-release "${{ steps.version.outputs.xr_release }}" \
            ${RT_FLAG}

      - name: Show ccache stats
        if: always() && steps.filter.outputs.skip != 'true'
        run: ccache -s

      - name: Upload RPM artifacts
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xr-rpms-${{ matrix.variant.name }}
          path: ~/rpmbuild/RPMS/**/*.rpm
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-xr-rpms-*
          merge-multiple: true
          path: rpms/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
          generate_release_notes: true
          body: |
            ## XR Kernel Release

            Built from tag `${{ github.ref_name }}` with patches from
            [XoxdWM](https://github.com/Jesssullivan/XoxdWM/tree/main/patches).

            ### Variants
            - **kernel-xr** (generic) — standard preemption
            - **kernel-xr-rt** — PREEMPT_RT real-time scheduling

            ### Patches applied
            - `0007-vesa-dsc-bpp.patch` — VESA DisplayID DSC BPP parser + QP/RC fixes
            - `bigscreen-beyond-edid.patch` — EDID non-desktop quirk (BIG/0x1234 + 0x5095)
            - PREEMPT_RT (RT variant only)

            ### Install
            ```bash
            # Generic variant
            sudo dnf install ./kernel-xr-*.x86_64.rpm

            # RT variant
            sudo dnf install ./kernel-xr-rt-*.x86_64.rpm

            sudo reboot
            ```

            ### Verify
            ```bash
            uname -r  # should show *-xr.el10
            ```
